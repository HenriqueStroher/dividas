<h2>Redefinição de senha</h2>
<p>Toque no link abaixo para escolher uma nova senha no app Dívidas:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha">Redefinir minha senha</a></p>
<p>Se você não pediu a redefinição, ignore este e-mail. Sua senha continua a mesma.</p>
